version: "1.0"

# 基础配置
profile:
  name: qodana.recommended

# 排除目录
exclude:
  - paths:
      - .gradle
      - .idea
      - build
      - gradle
      - libs
      - pyScripts
      - run

# 开启特定的冗余检查（注意缩进和层级）
include:
  - name: UnusedDeclaration
  - name: RedundantSuppression
  - name: RedundantExplicitType
  - name: RedundantCast
  - name: RedundantImplements